[[activity_js]]
name = "apps_put"
location = "activity/apps-put.js"
ffqn = "demo:fly-agent/apps.put"
params = [{ name = "org-slug", type = "string" }, { name = "app-name", type = "string" }]
return_type = "result<record { name: string, id: string }, string>"
exec.lock_expiry.seconds = 15
[[activity_js.allowed_host]]
pattern = "https://api.machines.dev"
methods = ["GET", "POST"]
secrets = ["FLY_API_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "apps_delete"
location = "activity/apps-delete.js"
ffqn = "demo:fly-agent/apps.delete"
params = [{ name = "app-name", type = "string" }, { name = "force", type = "bool" }]
return_type = "result<_, string>"
exec.lock_expiry.seconds = 15
[[activity_js.allowed_host]]
pattern = "https://api.machines.dev"
methods = ["DELETE"]
secrets = ["FLY_API_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "machines_create"
location = "activity/machines-create.js"
ffqn = "demo:fly-agent/machines.create"
params = [
  { name = "app-name", type = "string" },
  { name = "machine-name", type = "string" },
  { name = "machine-config-json", type = "string" },
  { name = "region", type = "string" },
]
return_type = "result<string, string>"
exec.lock_expiry.seconds = 15
[[activity_js.allowed_host]]
pattern = "https://api.machines.dev"
methods = ["POST"]
secrets = ["FLY_API_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "machines_get"
location = "activity/machines-get.js"
ffqn = "demo:fly-agent/machines.get"
params = [{ name = "app-name", type = "string" }, { name = "machine-id", type = "string" }]
return_type = "result<option<record { state: string }>, string>"
exec.lock_expiry.seconds = 15
[[activity_js.allowed_host]]
pattern = "https://api.machines.dev"
methods = ["GET"]
secrets = ["FLY_API_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "machines_exec"
location = "activity/machines-exec.js"
ffqn = "demo:fly-agent/machines.exec"
params = [
  { name = "app-name", type = "string" },
  { name = "machine-id", type = "string" },
  { name = "command", type = "list<string>" },
  { name = "timeout-secs", type = "u16" },
]
return_type = "result<record { exit-code: option<s32>, exit-signal: option<s32>, stderr: option<string>, stdout: option<string> }, string>"
exec.lock_expiry.seconds = 15
[[activity_js.allowed_host]]
pattern = "https://api.machines.dev"
methods = ["POST"]
secrets = ["FLY_API_TOKEN"]
replace_in = ["headers"]

# Inner workflow: creates the fly.io app, launches a VM, runs the agent, returns output.
# Does not delete the app — cleanup is the outer workflow's responsibility.
[[workflow_js]]
name = "agent"
location = "workflow/agent.js"
ffqn = "demo:fly-agent/workflow.agent"
params = [
  { name = "app-name", type = "string" },
  { name = "org-slug", type = "string" },
  { name = "prompt",   type = "string" },
]
return_type = "result<string, string>"

# Outer (saga) workflow: calls the agent child workflow and always deletes
# the fly.io app afterwards, even on failure or server crash.
[[workflow_js]]
name = "run"
location = "workflow/run.js"
ffqn = "demo:fly-agent/workflow.run"
params = [
  { name = "app-name", type = "string" },
  { name = "org-slug", type = "string" },
  { name = "prompt",   type = "string" },
]
return_type = "result<string, string>"

# Webhook: HTTP entry point for triggering the saga.
[[webhook_endpoint_js]]
name = "webhook"
location = "webhook/fly-agent.js"
routes = [{ methods = ["GET"], route = "/run/:org-slug/:app-name/:prompt" }]
